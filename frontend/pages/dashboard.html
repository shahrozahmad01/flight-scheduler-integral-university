<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Flight Scheduler</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div class="sidebar">
    <h2 style="margin-bottom:24px;">Flight Scheduler</h2>
    <nav>
      <a class="active" href="dashboard.html">🏠 Dashboard</a>
      <a href="flights.html">✈️ Flights</a>
      <a href="#">👤 Passengers</a>
      <button id="logoutBtn" class="btn btn-danger" style="margin-top:16px; width:100%;">Logout</button>
    </nav>
  </div>
  <main class="main-content">
    <div class="card">
      <div class="card-header">Operations Dashboard</div>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px;">
        <div class="stat-box"><div class="number" id="totalFlights">0</div><div class="label">Total Flights</div></div>
        <div class="stat-box"><div class="number" id="totalPassengers">0</div><div class="label">Total Passengers</div></div>
        <div class="stat-box"><div class="number" id="totalBookings">0</div><div class="label">Total Bookings</div></div>
        <div class="stat-box"><div class="number" id="onTimeFlights">0</div><div class="label">On-Time Flights</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Recent Flights</div>
      <div id="flightsTable">Loading flights...</div>
    </div>

    <div class="card">
      <div class="card-header">Recent Bookings</div>
      <div id="bookingsTable">Loading bookings...</div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    if (!sessionStorage.getItem('loggedIn')) {
      window.location.href = '../index.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('loggedIn');
      window.location.href = '../index.html';
    });

    async function loadDashboard() {
      try {
        const flights = await API.getFlights();
        const passengers = await API.getPassengers();
        const bookings = await API.getBookings();

        // Update statistics
        document.getElementById('totalFlights').textContent = flights.length;
        document.getElementById('totalPassengers').textContent = passengers.length;
        document.getElementById('totalBookings').textContent = bookings.length;
        document.getElementById('onTimeFlights').textContent = flights.filter(f => f.status === 'ON_TIME').length;

        // Display recent flights
        const flightRows = flights.slice(0, 10).map(f => `
          <tr>
            <td><strong>${f.flight_number}</strong></td>
            <td>${f.origin} → ${f.destination}</td>
            <td>${new Date(f.departure_time).toLocaleString()}</td>
            <td>${f.available_seats}/${f.total_seats}</td>
            <td><span class="badge-${f.status === 'ON_TIME' ? 'ontime' : f.status === 'DELAYED' ? 'delayed' : 'cancelled'}">${f.status}</span></td>
          </tr>
        `).join('');
        document.getElementById('flightsTable').innerHTML = `<table><thead><tr><th>Flight</th><th>Route</th><th>Departure</th><th>Seats</th><th>Status</th></tr></thead><tbody>${flightRows || '<tr><td colspan="5" style="text-align:center;">No flights found</td></tr>'}</tbody></table>`;

        // Display recent bookings
        const bookingRows = bookings.slice(0, 10).map(b => `
          <tr>
            <td><strong>${b.booking_ref}</strong></td>
            <td>${b.passenger_id}</td>
            <td>${b.seat_number}</td>
            <td>${b.seat_class}</td>
            <td><span class="badge-ontime">${b.status}</span></td>
          </tr>
        `).join('');
        document.getElementById('bookingsTable').innerHTML = `<table><thead><tr><th>Booking Ref</th><th>Passenger</th><th>Seat</th><th>Class</th><th>Status</th></tr></thead><tbody>${bookingRows || '<tr><td colspan="5" style="text-align:center;">No bookings found</td></tr>'}</tbody></table>`;
      } catch (error) {
        console.error('Dashboard error:', error);
        showError('Unable to load dashboard data');
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
