<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Scheduler</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="login-page" style="min-height:100vh; display:grid; place-items:center; background: linear-gradient(180deg, #1a3a5c 0%, #0d1f36 100%);">
    <div style="position:absolute; inset:0; opacity:0.06; background-image:url('data:image/svg+xml;charset=UTF-8,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\"><path d=\"M100 500C180 420 320 420 400 500C480 580 620 580 700 500\" stroke=\"white\" stroke-width=8 fill=\"none\" opacity=\"0.15\"/><path d=\"M240 180L300 150L280 180L320 210\" stroke=\"white\" stroke-width=6 fill=\"none\" opacity=\"0.08\"/></svg>'); background-repeat:no-repeat; background-position:center; filter: blur(1px);"></div>
    <div style="position:relative; width:min(420px,90vw); background:white; border-radius:24px; box-shadow:0 24px 80px rgba(0,0,0,0.18); padding:40px; z-index:1;">
      <div style="display:flex; align-items:center; gap:14px; margin-bottom:24px;">
        <div style="width:52px; height:52px; border-radius:18px; background:var(--accent); display:grid; place-items:center; color:white; font-size:1.6rem;">✈</div>
        <div>
          <h1 style="font-size:1.5rem; margin-bottom:6px; color:var(--primary);">Flight Scheduler</h1>
          <p style="margin:0; color:#475569;">Operations Portal</p>
        </div>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="Staff ID or Email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input id="password" type="password" placeholder="Enter password" style="padding-right:110px;" required>
            <button type="button" id="togglePassword" style="position:absolute; right:8px; top:8px; border:none; background:transparent; color:var(--primary); cursor:pointer;">Show</button>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; margin-top:12px;">Login</button>
      </form>
      <div style="display:flex; gap:12px; margin-top:24px;">
        <button class="btn" id="opsStaff" style="flex:1; background:#e9f2ff; color:var(--primary);">Operations Staff</button>
        <button class="btn" id="adminStaff" style="flex:1; background:#fef2f2; color:var(--danger);">Admin</button>
      </div>
      <p style="margin-top:24px; font-size:0.92rem; color:#64748b; text-align:center;">Flight Scheduler | Local Development</p>
    </div>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');

    toggle.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggle.textContent = type === 'password' ? 'Show' : 'Hide';
    });

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!usernameInput.value.trim() || !passwordInput.value.trim()) {
        alert('Please enter both username and password.');
        return;
      }
      const button = event.target.querySelector('button[type=submit]');
      button.textContent = 'Signing in...';
      button.disabled = true;
      sessionStorage.setItem('loggedIn', 'true');
      setTimeout(() => {
        window.location.href = 'pages/dashboard.html';
      }, 1000);
    });

    document.getElementById('opsStaff').addEventListener('click', () => {
      usernameInput.value = 'ops.staff@example.com';
      passwordInput.value = 'demo123';
    });
    document.getElementById('adminStaff').addEventListener('click', () => {
      usernameInput.value = 'admin@example.com';
      passwordInput.value = 'admin123';
    });
  </script>
</body>
</html>
